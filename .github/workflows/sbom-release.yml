# SBOM & Release Signing Workflow - AI-SecOps-Framework
# Generates CycloneDX and SPDX SBOMs, signs them with Sigstore
# Triggers: release published, version tags
name: SBOM & Release Signing

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Job 1: Generate and Sign SBOMs
  # ============================================
  sbom-generation:
    name: Generate & Sign SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for Sigstore keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SBOM tools
        run: |
          pip install cyclonedx-bom spdx-tools

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements \
            --output sbom.cyclonedx.json \
            --format json

      - name: Generate SPDX SBOM
        run: |
          python -m spdx_tools.generate \
            requirements.txt \
            --output sbom.spdx.json

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign SBOMs with Sigstore (Keyless)
        run: |
          cosign sign-blob --yes sbom.cyclonedx.json \
            --output-signature sbom.cyclonedx.json.sig \
            --output-certificate sbom.cyclonedx.json.pem
          cosign sign-blob --yes sbom.spdx.json \
            --output-signature sbom.spdx.json.sig \
            --output-certificate sbom.spdx.json.pem

      - name: Verify Signatures
        run: |
          cosign verify-blob sbom.cyclonedx.json \
            --signature sbom.cyclonedx.json.sig \
            --certificate sbom.cyclonedx.json.pem \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*'
          echo "✅ CycloneDX SBOM signature verified"
          
          cosign verify-blob sbom.spdx.json \
            --signature sbom.spdx.json.sig \
            --certificate sbom.spdx.json.pem \
            --certificate-identity-regexp='.*' \
            --certificate-oidc-issuer-regexp='.*'
          echo "✅ SPDX SBOM signature verified"

      - name: Upload SBOMs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom.cyclonedx.json
            sbom.cyclonedx.json.sig
            sbom.cyclonedx.json.pem
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem

      - name: Upload SBOMs as Artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.json.sig
            sbom.cyclonedx.json.pem
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.pem

  # ============================================
  # Job 2: OpenSSF Scorecard
  # ============================================
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard Results
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif

      - name: Upload to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
