# Linting & Type Checking Workflow - AI-SecOps-Framework
# Runs Ruff, Black, and MyPy on every push and PR
name: Linting & Type Checking

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Ruff (linter)
        run: |
          ruff check guardrails/ scripts/ tests/
        continue-on-error: true

      - name: Run Black (formatter check)
        run: |
          black --check guardrails/ scripts/ tests/
        continue-on-error: true

      - name: Run MyPy (type checker)
        run: |
          mypy guardrails/ --ignore-missing-imports --warn-unused-configs
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ruff (linter) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Black (formatter) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| MyPy (type checker) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
