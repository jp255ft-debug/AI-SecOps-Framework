# LLM Evaluation Workflow - AI-SecOps-Framework
# Automated LLM security evaluation pipeline
# Triggers: manual (workflow_dispatch), schedule (weekly)
name: LLM Security Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to evaluate (e.g., gpt-4, claude-3)'
        required: false
        default: 'gpt-4'
        type: string
      severity:
        description: 'Minimum severity to fail'
        required: false
        default: 'high'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8:00 UTC

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Job 1: Giskard LLM Vulnerability Scan
  # ============================================
  giskard-scan:
    name: Giskard - LLM Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install giskard langchain openai

      - name: Run Giskard Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_NAME: ${{ github.event.inputs.model || 'gpt-4' }}
        run: |
          python tests/models/test_giskard_vulns.py \
            --output giskard_results.json \
            --model "$MODEL_NAME" || true

      - name: Upload Giskard Results
        uses: actions/upload-artifact@v4
        with:
          name: giskard-results
          path: giskard_results.json

      - name: Check Results
        run: |
          if [ -f giskard_results.json ]; then
            python3 -c "
import json, sys
with open('giskard_results.json') as f:
    data = json.load(f)
summary = data.get('summary', {})
total = summary.get('total', 0)
failed = summary.get('failed', 0)
print(f'Tests: {total} total, {failed} failed')
if failed > 0:
    print('FAILED: Some LLM vulnerability tests did not pass')
    sys.exit(1)
else:
    print('PASSED: All LLM security tests passed')
"
          fi

  # ============================================
  # Job 2: Prompt Injection Tests
  # ============================================
  prompt-injection:
    name: Promptfoo - Injection Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Promptfoo
        run: |
          npm install -g promptfoo

      - name: Run Prompt Injection Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd tests/prompt_injection
          promptfoo eval \
            --config promptfoo.yaml \
            --output promptfoo_results.json || true

      - name: Upload Promptfoo Results
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: tests/prompt_injection/promptfoo_results.json

  # ============================================
  # Job 3: Generate LLM Security Report
  # ============================================
  report:
    name: Generate LLM Security Report
    runs-on: ubuntu-latest
    needs: [giskard-scan, prompt-injection]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate Report
        run: |
          mkdir -p report
          cat > report/LLM_SECURITY_REPORT.md << 'EOF'
# LLM Security Evaluation Report

**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
**Model:** ${{ github.event.inputs.model || 'default' }}

---

## Results

| Test | Status | Details |
|------|--------|---------|
| Giskard Vulnerability Scan | ${{ needs.giskard-scan.result }} | See artifacts/giskard-results |
| Prompt Injection Tests | ${{ needs.prompt-injection.result }} | See artifacts/promptfoo-results |

---

*Generated by AI-SecOps-Framework LLM Evaluation Pipeline*
EOF

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: llm-security-report
          path: report/LLM_SECURITY_REPORT.md
