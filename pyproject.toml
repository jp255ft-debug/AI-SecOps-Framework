[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-secops-framework"
version = "1.0.0"
description = "DevSecOps auditing framework for LLM/ML infrastructures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI-SecOps-Framework Contributors", email = "contact@ai-secops-framework.com"}
]
keywords = ["security", "devsecops", "llm", "ml", "owasp", "audit", "mlsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "semgrep>=1.60.0",
    "giskard>=2.0.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "nemoguardrails>=0.5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "atheris>=2.3.0",
    "cyclonedx-bom>=4.0.0",
    "spdx-tools>=0.8.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jp255ft-debug/AI-SecOps-Framework"
Documentation = "https://github.com/jp255ft-debug/AI-SecOps-Framework/wiki"
Repository = "https://github.com/jp255ft-debug/AI-SecOps-Framework"
Issues = "https://github.com/jp255ft-debug/AI-SecOps-Framework/issues"

[project.scripts]
ai-secops-audit = "guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=guardrails --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.coverage.run]
source = ["guardrails"]
omit = ["*/tests/*", "*/__pycache__/*"]
